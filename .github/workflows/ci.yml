name: CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
permissions:
  contents: read
jobs:

  build:
    name: build
    runs-on: ubuntu-latest
    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: test -z "$(gofmt -s -d .)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: make test-unit

version: 2
builds:
- main: ./main.go
  env:
  - CGO_ENABLED=0
  goos:
    - darwin
    - linux
    - windows
  goarch:
    - amd64
    - arm64
  ldflags:
    - -s -w -X github.com/ayates83/kubectl-neat/cmd.Version={{ .Version }}
archives:
- name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Tag }}-next"
release:
  prerelease: auto # tags like v3.0.0-rc.1 are published as pre-releases
changelog:
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^Merge pull request'
